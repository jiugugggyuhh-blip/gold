<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Gold bar with gradient -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- First bar -->
  <rect x="10" y="20" width="50" height="80" rx="3" fill="url(#goldGradient)" stroke="#DAA520" stroke-width="1"/>
  <rect x="10" y="20" width="50" height="80" rx="3" fill="url(#shadowGradient)" opacity="0.3"/>
  
  <!-- Second bar -->
  <rect x="75" y="15" width="50" height="85" rx="3" fill="url(#goldGradient)" stroke="#DAA520" stroke-width="1"/>
  <rect x="75" y="15" width="50" height="85" rx="3" fill="url(#shadowGradient)" opacity="0.3"/>
  
  <!-- Third bar -->
  <rect x="140" y="25" width="50" height="75" rx="3" fill="url(#goldGradient)" stroke="#DAA520" stroke-width="1"/>
  <rect x="140" y="25" width="50" height="75" rx="3" fill="url(#shadowGradient)" opacity="0.3"/>
  
  <!-- Shine effect on first bar -->
  <rect x="12" y="22" width="46" height="15" rx="2" fill="#FFF" opacity="0.2"/>
  
  <!-- Shine effect on second bar -->
  <rect x="77" y="17" width="46" height="15" rx="2" fill="#FFF" opacity="0.2"/>
  
  <!-- Shine effect on third bar -->
  <rect x="142" y="27" width="46" height="15" rx="2" fill="#FFF" opacity="0.2"/>
</svg>
